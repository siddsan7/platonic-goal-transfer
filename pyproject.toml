[project]
name = "pgt"
version = "0.1.0"
description = "Controlled study of training pairs and text-goal transfer in a learned visual planner"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.4.6"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.16.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
